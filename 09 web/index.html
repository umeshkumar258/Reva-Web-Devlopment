<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding IDs and Classes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>HTML Identifiers: IDs and Classes</h1>
    </header>

    <main>
        <section>
            <p>An <code>id</code> is an attribute used to uniquely identify a single element on a page, whereas a <code>class</code> can be shared across multiple elements.</p>
        </section>

        <section class="examples">
            <div id="user-primary" class="card">
                <p>Primary User Content</p>
            </div>

            <div class="color-box red"></div>

            <span id="user-secondary" class="card">
                Secondary User Content
            </span>
        </section>
    </main>

</body>
</html>
