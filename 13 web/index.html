<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Practice Page</title>
</head>
<body>

    <!-- Paragraph for simple text comparisons -->
    <p>Is 3 greater than 5? 3 &gt; 5</p>

    <!-- Displaying raw HTML tags as text on the page -->

    <!-- Link styled inside a paragraph -->
    <p>
        <a href="https://www.youtube.com" target="_blank">Open YouTube</a>
    </p>

</body>
</html>
